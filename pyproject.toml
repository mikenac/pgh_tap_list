[project]
name = "pgh-tap-list"
version = "0.1.0"
description = "Pittsburgh brewery taplist tracker scraper framework"
readme = "PROJECT.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
  "pypdf>=4.3.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "--cov=scripts --cov=taplist_tracker --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taplist_tracker"]
